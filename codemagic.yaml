workflows:
  android-release:
    name: GreenDisha AI — Android APK
    max_build_duration: 60
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get packages
        script: flutter pub get
      - name: Build APK
        script: flutter build apk --release --no-tree-shake-icons
    artifacts:
      - build/**/outputs/**/*.apk
    publishing:
      email:
        recipients:
          - YOUR_EMAIL_HERE@gmail.com
        notify:
          success: true
          failure: true
